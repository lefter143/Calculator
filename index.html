<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="calculator">
        <div class="display-result"><span class="calculator-screen"></span></div>
        
        <div class="numpad">
            
            <div class="row" id="operator-row">
                <button id="plus-operator"><img class="operator" src="./src/icons8_plus_math.svg" alt="plus icon"></button>
                <button id="minus-operator"><img class="operator" src="./src/icons8_subtract.svg" alt="minus icon"></button>
                <button id="multiplication-operator"><img class="operator" src="./src/icons8_multiply.svg" alt="multiplication icon"></button>
                <button id="division-operator"><img class="operator" src="./src/icons8_divide.svg" alt="division icon"></button>
            </div>

            <div class="row">
                <span id="seven" class="number">7</span>
                <span id="eight" class="number">8</span>
                <span id="nine" class="number">9</span>
                <span id="four" class="number">4</span>
            </div>

            <div class="row">
                <span id="five" class="number">5</span>
                <span id="six" class="number">6</span>
                <span id="one" class="number">1</span>
                <span id="two" class="number">2</span>
            </div>

            <div class="row">
                <span id="three" class="number">3</span>
                <span id="zero" class="number">0</span>
                <span id="dot" class="number">.</span>
                <span id="clear">C</span>
            </div>

            <div class="row">
                <span id="equal-sign">=</span>
            </div>

        </div>
    </div>
</body>
</html>
